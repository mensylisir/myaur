name: upstream-check

on:
  schedule:
    # 每 2 天 03:00 UTC 探测一次。cron 没有「每两天」语法，用 day-of-month 步进；
    # 月末会从 31 跳到 1，出现相邻两天连跑，属于可接受的偏差。
    - cron: '0 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe upstream releases
        id: probe
        run: |
          set +e
          python3 scripts/check-upstream-updates.py --json "${RUNNER_TEMP}/updates.json"
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Report to tracking issue
        if: steps.probe.outputs.rc != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let data;
            try {
              data = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'updates.json'), 'utf8'));
            } catch {
              data = { results: [], updates: [], errors: ['探测结果文件缺失，脚本可能提前退出'] };
            }
            const label = 'upstream-check';
            const title = data.updates.length ? '上游版本检测：有包需要更新' : '上游版本检测：探测失败';

            const lines = [];
            lines.push(`运行时间：${new Date().toISOString()}（工作流 \`${context.workflow}\`）`);
            lines.push('');
            for (const row of data.results) {
              const upstream = row.upstream || '(探测失败)';
              const note = row.state === 'error' ? ` 失败：${row.error}` : '';
              lines.push(`- [${row.state}] **${row.product}**（${row.package}）：\`${row.current}\` → \`${upstream}\`${note}`);
              if (row.state === 'update' && row.url) lines.push(`  - ${row.url}`);
              if (row.state === 'update' && row.checksum) lines.push(`  - sha256: \`${row.checksum}\``);
            }
            lines.push('');
            lines.push(`结论：${data.updates.length} 个待更新，${data.errors.length} 个探测失败。`);
            lines.push(`工作流运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);
            const body = lines.join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
            });

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'fbca04' });
            }

            if (issues.length) {
              const target = issues[0];
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: target.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: [label] });
            }

      - name: Close tracking issue when everything is current
        if: steps.probe.outputs.rc == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-check',
              state: 'open',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `全部包已是最新，自动关闭。${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
