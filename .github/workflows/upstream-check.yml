name: upstream-check

on:
  schedule:
    # 每 2 天 03:00 UTC 探测一次。cron 没有「每两天」语法，用 day-of-month 步进；
    # 月末会从 31 跳到 1，出现相邻两天连跑，属于可接受的偏差。
    - cron: '0 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe upstream releases and email the report
        id: probe
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set +e
          python3 scripts/check-upstream-updates.py --json "${RUNNER_TEMP}/updates.json" --mail
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Show probe result
        run: python3 -m json.tool "${RUNNER_TEMP}/updates.json" || true
